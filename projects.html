---
title: Projects
permalink: /projects/
---
<h1>Projects</h1>
{% assign projects = site.projects | sort: "order" %}
<div class="project-grid">
  {% for p in projects %}
  <a class="card" href="{{ p.url | relative_url }}">
    <div class="card-img">
      {% if p.thumbnail %}<img src="{{ p.thumbnail | relative_url }}" alt="" loading="lazy">{% endif %}
    </div>
    <div class="card-body">
      <h2>{{ p.title }}</h2>
      {% if p.subtitle %}<p class="meta">{{ p.subtitle }}</p>{% endif %}
      <p>{{ p.summary }}</p>
      <span class="more">Read more &rarr;</span>
    </div>
  </a>
  {% endfor %}
</div>

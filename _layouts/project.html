---
layout: default
---
<article class="project">
  <p class="back"><a href="{{ '/projects/' | relative_url }}">&larr; All projects</a></p>
  <header class="project-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="meta">{{ page.subtitle }}</p>{% endif %}
    {% if page.tags %}<ul class="tags">{% for t in page.tags %}<li>{{ t }}</li>{% endfor %}</ul>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
